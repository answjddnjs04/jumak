<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>주방 관리</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .app { display:flex; flex-direction:column; height:100vh; width:100vw; overflow:hidden; }

    /* 헤더 */
    .header {
      flex-shrink: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 28px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-logo { font-size: 18px; font-weight: 800; display:flex; align-items:center; gap:8px; }
    .header-logo span { color: var(--primary); }

    /* 탭 */
    .tabs {
      flex-shrink: 0;
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 28px;
      gap: 4px;
    }
    .tab-btn {
      padding: 14px 24px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      border: none;
      background: transparent;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
      margin-bottom: -1px;
    }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
    .tab-btn:hover:not(.active) { color: var(--text); }

    /* 탭 컨텐츠 */
    .tab-content { display:none; flex:1; overflow:hidden; padding:18px 28px; }
    .tab-content.active { display:flex; flex-direction:column; }

    /* 요약바 */
    .summary-bar {
      flex-shrink: 0;
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    .sum-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }
    .sum-card .icon { font-size: 22px; }
    .sum-card .num { font-size: 24px; font-weight: 800; line-height:1; }
    .sum-card .lbl { font-size: 11px; color: var(--text-muted); margin-top:2px; }
    .num.orange { color: var(--primary); }
    .num.green { color: var(--green); }
    .num.red { color: var(--red); }

    /* 주문 그리드 */
    .orders-grid {
      flex: 1;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
      align-content: start;
      padding-right: 4px;
    }
    @media (min-width: 1300px) {
      .orders-grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
    }
    .orders-grid::-webkit-scrollbar { width: 4px; }
    .orders-grid::-webkit-scrollbar-track { background: transparent; }
    .orders-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* 주문 카드 */
    .order-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .order-card.cooking { border-color: rgba(234,179,8,0.4); }
    .order-card.all-served { border-color: rgba(34,197,94,0.4); }

    .oc-header { display:flex; align-items:center; justify-content:space-between; }
    .oc-title { font-size:18px; font-weight:800; }
    .oc-elapsed { font-size:12px; color:var(--text-muted); }

    .progress-bar { background:var(--surface2); border-radius:10px; height:6px; overflow:hidden; }
    .progress-fill { height:100%; background:var(--green); border-radius:10px; transition:width 0.4s; }

    .menu-list { display:flex; flex-direction:column; gap:6px; }
    .menu-item {
      display:flex; align-items:center; gap:10px;
      background:var(--surface2); border-radius:8px; padding:9px 12px;
      cursor:pointer; transition:all 0.15s; border:1.5px solid transparent;
    }
    .menu-item:hover { border-color:var(--primary); }
    .menu-item.served { background:rgba(34,197,94,0.07); border-color:rgba(34,197,94,0.25); }
    .check {
      width:20px; height:20px; border-radius:5px; border:2px solid var(--border);
      display:flex; align-items:center; justify-content:center; flex-shrink:0;
      font-size:12px; transition:all 0.15s;
    }
    .menu-item.served .check { background:var(--green); border-color:var(--green); }
    .menu-name { flex:1; font-size:14px; }
    .menu-item.served .menu-name { text-decoration:line-through; color:var(--text-muted); }
    .menu-qty { font-size:12px; color:var(--text-muted); font-weight:600; }

    .complete-btn { width:100%; padding:12px; font-size:14px; font-weight:700; border-radius:10px; }

    .empty-state { color:var(--text-muted); font-size:14px; text-align:center; padding:48px; }

    /* 테이블/웨이팅 관리 (웨이팅 탭) */
    .two-col { display:grid; grid-template-columns:1fr 1fr; gap:16px; flex:1; overflow:hidden; }
    @media (max-width: 900px) { .two-col { grid-template-columns:1fr; } }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-header {
      flex-shrink: 0;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .panel-title { font-size: 14px; font-weight: 700; }
    .panel-body { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px; }
    .panel-body::-webkit-scrollbar { width:4px; }
    .panel-body::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }

    /* 테이블 관리 카드 */
    .tmgmt-card {
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .tmgmt-card.occupied { border-color: rgba(239,68,68,0.3); }
    .tmgmt-num { font-size:18px; font-weight:800; width:36px; }
    .tmgmt-info { flex:1; }
    .tmgmt-timer { font-size:16px; font-weight:700; font-variant-numeric:tabular-nums; }
    .occupied .tmgmt-timer { color:var(--red); }
    .tmgmt-actions { display:flex; gap:6px; }
    .tmgmt-actions .btn { padding:7px 12px; font-size:12px; }

    /* 웨이팅 아이템 */
    .waiting-item {
      background: var(--surface2);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .wrank { font-size:20px; font-weight:800; color:var(--primary); width:24px; }
    .winfo { flex:1; }
    .wphone { font-size:14px; font-weight:600; }
    .wsub { font-size:11px; color:var(--text-muted); margin-top:2px; }
    .wactions { display:flex; gap:6px; }
    .wactions .btn { padding:7px 12px; font-size:12px; }

    /* 주문 추가 모달 내부 */
    .menu-input-row { display:flex; gap:8px; margin-bottom:8px; }
    .menu-input-row input { margin-bottom:0; }
  </style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="header-logo">🍳 <span>주방 관리</span></div>
    <div style="display:flex; align-items:center; gap:16px;">
      <div id="hdr-stats" style="font-size:13px; color:var(--text-muted);"></div>
      <button class="btn btn-outline" style="font-size:13px; padding:8px 16px;" onclick="loadAll()">🔄 새로고침</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('kitchen')">🍳 주방 관리</button>
    <button class="tab-btn" onclick="switchTab('waiting')">🙋 웨이팅 관리</button>
  </div>

  <!-- 주방 관리 탭 -->
  <div class="tab-content active" id="tab-kitchen">
    <div class="summary-bar">
      <div class="sum-card">
        <div class="icon">🔥</div>
        <div><div class="num orange" id="cooking-count">0</div><div class="lbl">조리 중</div></div>
      </div>
      <div class="sum-card">
        <div class="icon">✅</div>
        <div><div class="num green" id="served-count">0</div><div class="lbl">서빙 완료</div></div>
      </div>
      <div class="sum-card">
        <div class="icon">🪑</div>
        <div><div class="num red" id="table-occ-count">0</div><div class="lbl">이용 중 테이블</div></div>
      </div>
      <button class="btn btn-primary" style="padding:12px 20px; font-size:14px;" onclick="openAddOrderModal()">+ 주문 추가</button>
    </div>
    <div class="orders-grid" id="orders-grid">
      <div class="empty-state">현재 조리 중인 주문이 없습니다.</div>
    </div>
  </div>

  <!-- 웨이팅 관리 탭 -->
  <div class="tab-content" id="tab-waiting">
    <div class="two-col">

      <!-- 테이블 관리 패널 -->
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">🪑 테이블 관리</div>
          <span class="badge badge-gray" id="table-status-badge">-</span>
        </div>
        <div class="panel-body" id="table-mgmt-list"></div>
      </div>

      <!-- 웨이팅 패널 -->
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">🙋 대기 목록</div>
          <span class="badge badge-yellow" id="waiting-badge">0팀</span>
        </div>
        <div class="panel-body" id="waiting-list"></div>
      </div>

    </div>
  </div>

</div>

<!-- 주문 추가 모달 -->
<div class="modal-overlay" id="add-order-modal">
  <div class="modal">
    <h2>📋 주문 추가</h2>
    <div class="sub">테이블과 메뉴를 입력하세요.</div>
    <select id="order-table-select"></select>
    <div id="menu-inputs">
      <div class="menu-input-row">
        <input type="text" placeholder="메뉴 이름" style="flex:2">
        <input type="number" placeholder="수량" min="1" value="1" style="flex:0.6">
      </div>
    </div>
    <button class="btn btn-outline" style="width:100%; margin-bottom:14px;" onclick="addMenuRow()">+ 메뉴 추가</button>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeAddOrderModal()">취소</button>
      <button class="btn btn-primary" onclick="submitOrder()">주문 등록</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="config.js"></script>
<script>
  let orders=[], tables=[], waitings=[], timerInterval=null

  function switchTab(name) {
    document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active', ['kitchen','waiting'][i]===name))
    document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'))
    document.getElementById('tab-'+name).classList.add('active')
  }

  async function loadAll() {
    await Promise.all([loadOrders(), loadTables(), loadWaitings()])
    startTimers()
  }

  async function loadOrders() {
    const {data} = await db.from('orders').select('*').in('status',['cooking','partial']).order('created_at')
    orders = data||[]; renderOrders(); updateSummary()
  }
  async function loadTables() {
    const {data} = await db.from('tables').select('*').order('id')
    tables = data||[]; renderTableMgmt(); updateSummary(); populateSelect()
  }
  async function loadWaitings() {
    const {data} = await db.from('waitings').select('*').eq('status','waiting').order('created_at')
    waitings = data||[]; renderWaitingList(); updateSummary()
  }

  function updateSummary() {
    document.getElementById('cooking-count').textContent = orders.filter(o=>o.status==='cooking').length
    document.getElementById('served-count').textContent = orders.filter(o=>o.status==='partial').length
    const occ = tables.filter(t=>t.status==='occupied').length
    document.getElementById('table-occ-count').textContent = occ
    document.getElementById('table-status-badge').textContent = `${occ}/${tables.length}석 이용중`
    document.getElementById('waiting-badge').textContent = waitings.length + '팀'
    document.getElementById('hdr-stats').textContent = `조리 ${orders.filter(o=>o.status==='cooking').length} · 대기 ${waitings.length}팀`
  }

  function renderOrders() {
    const g = document.getElementById('orders-grid')
    if (!orders.length) { g.innerHTML = '<div class="empty-state">현재 조리 중인 주문이 없습니다.</div>'; return }
    g.innerHTML = orders.map(o => {
      const items = o.items||[], served = o.served_items||{}
      const sc = items.filter(i=>served[i.name]).length, tot = items.length
      const allDone = sc===tot, pct = tot>0?Math.round(sc/tot*100):0
      const elapsed = Math.floor((new Date()-new Date(o.created_at))/60000)
      return `
      <div class="order-card ${allDone?'all-served':'cooking'}">
        <div class="oc-header">
          <div class="oc-title">🪑 ${o.table_number}번</div>
          <div style="display:flex;gap:8px;align-items:center">
            <span class="badge ${allDone?'badge-green':'badge-yellow'}">${allDone?'서빙완료':'조리중'}</span>
            <span class="oc-elapsed">${elapsed}분 전</span>
          </div>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div style="font-size:11px;color:var(--text-muted)">${sc}/${tot} 서빙 완료</div>
        <div class="menu-list">
          ${items.map(item=>`
            <div class="menu-item ${served[item.name]?'served':''}" onclick="toggleServed('${o.id}','${item.name}')">
              <div class="check">${served[item.name]?'✓':''}</div>
              <div class="menu-name">${item.name}</div>
              <div class="menu-qty">×${item.qty}</div>
            </div>
          `).join('')}
        </div>
        ${allDone?`<button class="btn btn-green complete-btn" onclick="completeOrder('${o.id}',${o.table_id})">✅ 다 나감 → 타이머 시작</button>`:''}
      </div>`
    }).join('')
  }

  async function toggleServed(oid, name) {
    const o = orders.find(x=>x.id===oid); if(!o) return
    const s = {...(o.served_items||{})}; s[name] = !s[name]
    const allDone = (o.items||[]).every(i=>s[i.name])
    await db.from('orders').update({served_items:s, status:allDone?'partial':'cooking'}).eq('id',oid)
    await loadOrders()
  }

  async function completeOrder(oid, tableId) {
    const end = new Date(Date.now()+2*60*60*1000).toISOString()
    await Promise.all([
      db.from('orders').update({status:'served'}).eq('id',oid),
      db.from('tables').update({status:'occupied',timer_end_at:end}).eq('id',tableId)
    ])
    showToast('⏱️ 2시간 타이머 시작!'); await loadAll()
  }

  function renderTableMgmt() {
    const c = document.getElementById('table-mgmt-list')
    c.innerHTML = tables.map(t => {
      const occ = t.status==='occupied'
      const rem = t.timer_end_at ? Math.max(0,Math.floor((new Date(t.timer_end_at)-new Date())/1000)) : null
      return `
      <div class="tmgmt-card ${occ?'occupied':''}">
        <div class="tmgmt-num">${t.table_number}번</div>
        <div class="tmgmt-info">
          <span class="badge ${occ?'badge-red':'badge-green'}">${occ?'이용중':'비어있음'}</span>
          ${occ&&rem!==null?`<div class="tmgmt-timer" data-end="${t.timer_end_at}">${fmt(rem)}</div>`:''}
        </div>
        <div class="tmgmt-actions">
          ${occ
            ? `<button class="btn btn-red" onclick="clearTable(${t.id})">퇴실</button>`
            : `<button class="btn btn-primary" onclick="seatTable(${t.id})">착석</button>`}
        </div>
      </div>`
    }).join('')
  }

  async function seatTable(id) { await db.from('tables').update({status:'occupied',timer_end_at:null}).eq('id',id); await loadTables() }
  async function clearTable(id) { if(!confirm('퇴실 처리하시겠습니까?')) return; await db.from('tables').update({status:'empty',timer_end_at:null}).eq('id',id); await loadTables() }

  function renderWaitingList() {
    const c = document.getElementById('waiting-list')
    if (!waitings.length) { c.innerHTML = '<div class="empty-state">대기 중인 팀이 없습니다.</div>'; return }
    c.innerHTML = waitings.map((w,i)=>`
      <div class="waiting-item">
        <div class="wrank">${i+1}</div>
        <div class="winfo">
          <div class="wphone">${w.phone}</div>
          <div class="wsub">${timeAgo(w.created_at)} 신청</div>
        </div>
        <div class="wactions">
          <button class="btn btn-primary" onclick="callWaiting('${w.id}')">호출</button>
          <button class="btn btn-outline" onclick="cancelWaiting('${w.id}')">취소</button>
        </div>
      </div>
    `).join('')
  }

  async function callWaiting(id) { await db.from('waitings').update({status:'called'}).eq('id',id); showToast('📞 호출 처리됨'); await loadWaitings() }
  async function cancelWaiting(id) { if(!confirm('취소하시겠습니까?')) return; await db.from('waitings').update({status:'cancelled'}).eq('id',id); await loadWaitings() }

  function populateSelect() {
    const s = document.getElementById('order-table-select')
    s.innerHTML = tables.map(t=>`<option value="${t.id}" data-num="${t.table_number}">${t.table_number}번 테이블</option>`).join('')
  }
  function openAddOrderModal() { document.getElementById('add-order-modal').classList.add('active') }
  function closeAddOrderModal() { document.getElementById('add-order-modal').classList.remove('active') }
  function addMenuRow() {
    const d = document.createElement('div'); d.className='menu-input-row'
    d.innerHTML=`<input type="text" placeholder="메뉴 이름" style="flex:2"><input type="number" placeholder="수량" min="1" value="1" style="flex:0.6">`
    document.getElementById('menu-inputs').appendChild(d)
  }
  async function submitOrder() {
    const sel = document.getElementById('order-table-select')
    const tableId = parseInt(sel.value), tableNum = parseInt(sel.selectedOptions[0].dataset.num)
    const items = []
    document.querySelectorAll('.menu-input-row').forEach(row => {
      const ins = row.querySelectorAll('input')
      const name = ins[0].value.trim(), qty = parseInt(ins[1].value)||1
      if(name) items.push({name,qty})
    })
    if(!items.length) { showToast('메뉴를 입력해주세요.'); return }
    const {error} = await db.from('orders').insert({table_id:tableId,table_number:tableNum,items,served_items:{},status:'cooking'})
    if(error) { showToast('오류: '+error.message); return }
    closeAddOrderModal(); showToast('✅ 주문 등록 완료!'); await loadAll()
  }

  function startTimers() {
    if(timerInterval) clearInterval(timerInterval)
    timerInterval = setInterval(()=>{
      document.querySelectorAll('[data-end]').forEach(el=>{
        const rem = Math.max(0,Math.floor((new Date(el.dataset.end)-new Date())/1000))
        el.textContent = fmt(rem)
        if(rem===0) el.style.color='var(--yellow)'
      })
    },1000)
  }

  function fmt(sec) {
    if(sec<=0) return '00:00'
    const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60
    if(h>0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
  }
  function timeAgo(d) { const m=Math.floor((new Date()-new Date(d))/60000); return m<1?'방금':`${m}분 전` }
  function showToast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3000) }

  db.channel('kds').on('postgres_changes',{event:'*',schema:'public',table:'orders'},loadAll)
    .on('postgres_changes',{event:'*',schema:'public',table:'tables'},loadAll)
    .on('postgres_changes',{event:'*',schema:'public',table:'waitings'},loadWaitings).subscribe()

  loadAll()
</script>
</body>
</html>
