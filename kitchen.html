<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>路寶官 - 주방 관리</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    html,body{overflow:hidden;}
    .app{display:flex;flex-direction:column;height:100vh;width:100vw;overflow:hidden;}

    /* 헤더 */
    .header{flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;}
    .header-logo{font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px;}
    .header-logo span{color:var(--primary);}
    .hdr-right{display:flex;align-items:center;gap:12px;}
    .hdr-stats{font-size:12px;color:var(--text-muted);}

    /* 탭 */
    .tabs{flex-shrink:0;display:flex;background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;gap:4px;}
    .tab-btn{padding:13px 22px;font-size:14px;font-weight:600;color:var(--text-muted);border:none;background:transparent;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;margin-bottom:-1px;}
    .tab-btn.active{color:var(--primary);border-bottom-color:var(--primary);}

    /* 탭 컨텐츠 */
    .tab-content{display:none;flex:1;overflow:hidden;}
    .tab-content.active{display:flex;}

    /* ── 요리 관리 탭 (2컬럼) ── */
    .kitchen-cols{display:grid;grid-template-columns:1fr 1fr;gap:0;flex:1;overflow:hidden;}
    .col{display:flex;flex-direction:column;overflow:hidden;border-right:1px solid var(--border);}
    .col:last-child{border-right:none;}
    .col-header{flex-shrink:0;padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--surface);}
    .col-title{font-size:14px;font-weight:800;}
    .col-body{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;}
    .col-body::-webkit-scrollbar{width:3px;}
    .col-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

    /* 주문 카드 (이체완료 좌측) */
    .order-card{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:14px 16px;}
    .order-card.cooking{border-color:rgba(234,179,8,.35);}
    .order-card.all-served{border-color:rgba(34,197,94,.4);}
    .oc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
    .oc-title{font-size:17px;font-weight:800;}
    .oc-meta{display:flex;align-items:center;gap:8px;}
    .oc-time{font-size:11px;color:var(--text-muted);}
    .prog-bar{background:var(--surface2);border-radius:6px;height:5px;overflow:hidden;margin-bottom:8px;}
    .prog-fill{height:100%;background:var(--green);border-radius:6px;transition:width .4s;}
    .prog-txt{font-size:11px;color:var(--text-muted);margin-bottom:10px;}
    .menu-list{display:flex;flex-direction:column;gap:6px;}
    .menu-item{display:flex;align-items:center;gap:9px;background:var(--surface2);border-radius:8px;padding:9px 12px;cursor:pointer;border:1.5px solid transparent;transition:all .15s;}
    .menu-item:hover{border-color:var(--primary);}
    .menu-item.served{background:rgba(34,197,94,.07);border-color:rgba(34,197,94,.25);}
    .chk{width:20px;height:20px;border-radius:5px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;transition:all .15s;}
    .menu-item.served .chk{background:var(--green);border-color:var(--green);}
    .mn{flex:1;font-size:13px;}
    .menu-item.served .mn{text-decoration:line-through;color:var(--text-muted);}
    .mq{font-size:12px;color:var(--text-muted);font-weight:600;}
    .complete-btn{width:100%;padding:11px;font-size:13px;font-weight:700;border-radius:9px;margin-top:10px;}

    /* 대기 주문 카드 (우측) */
    .pending-card{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:14px 16px;}
    .pc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
    .pc-title{font-size:17px;font-weight:800;}
    .pc-time{font-size:11px;color:var(--text-muted);}
    .pc-items{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;}
    .pc-item{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid var(--border);}
    .pc-item:last-child{border-bottom:none;}
    .pc-total{font-size:14px;font-weight:800;color:var(--primary);text-align:right;margin-bottom:12px;}
    .paid-btn{width:100%;padding:11px;font-size:13px;font-weight:700;border-radius:9px;background:var(--primary);color:white;border:none;cursor:pointer;}
    .paid-btn:hover{background:var(--primary-dark);}

    /* ── 웨이팅 관리 탭 ── */
    .waiting-cols{display:grid;grid-template-columns:1fr 1fr;gap:0;flex:1;overflow:hidden;}
    .panel{display:flex;flex-direction:column;overflow:hidden;border-right:1px solid var(--border);}
    .panel:last-child{border-right:none;}
    .panel-header{flex-shrink:0;padding:13px 18px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:space-between;}
    .panel-title{font-size:14px;font-weight:800;}
    .panel-body{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;}
    .panel-body::-webkit-scrollbar{width:3px;}
    .panel-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

    .tmgmt-card{background:var(--surface2);border:1.5px solid var(--border);border-radius:11px;padding:11px 14px;display:flex;align-items:center;gap:10px;}
    .tmgmt-card.occupied{border-color:rgba(239,68,68,.3);}
    .tmgmt-num{font-size:16px;font-weight:800;width:34px;}
    .tmgmt-info{flex:1;}
    .tmgmt-timer{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;}
    .occupied .tmgmt-timer{color:var(--red);}
    .tmgmt-actions{display:flex;gap:5px;}
    .tmgmt-actions .btn{padding:6px 11px;font-size:12px;}

    .witem{background:var(--surface2);border-radius:11px;padding:11px 14px;display:flex;align-items:center;gap:10px;}
    .wrank{font-size:18px;font-weight:800;color:var(--primary);width:22px;}
    .winfo{flex:1;}
    .wphone{font-size:14px;font-weight:600;}
    .wsub{font-size:11px;color:var(--text-muted);margin-top:2px;}
    .wactions{display:flex;gap:5px;}
    .wactions .btn{padding:6px 10px;font-size:12px;}

    .empty-state{color:var(--text-muted);font-size:13px;text-align:center;padding:40px;}

    /* 요약 바 */
    .summary-bar{flex-shrink:0;display:flex;background:var(--surface);border-bottom:1px solid var(--border);}
    .sum-item{flex:1;padding:10px 16px;text-align:center;border-right:1px solid var(--border);}
    .sum-item:last-child{border-right:none;}
    .sum-num{font-size:20px;font-weight:800;}
    .sum-lbl{font-size:10px;color:var(--text-muted);margin-top:2px;}
    .orange{color:var(--primary);}
    .green{color:var(--green);}
    .red{color:var(--red);}
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-logo">路寶官 <span>주방 관리</span></div>
    <div class="hdr-right">
      <div class="hdr-stats" id="hdr-stats"></div>
      <button class="btn btn-outline" style="padding:7px 14px;font-size:12px;" onclick="loadAll()">🔄 새로고침</button>
    </div>
  </div>

  <div class="summary-bar">
    <div class="sum-item"><div class="sum-num orange" id="s-pending">0</div><div class="sum-lbl">이체 대기</div></div>
    <div class="sum-item"><div class="sum-num" id="s-cooking">0</div><div class="sum-lbl">조리 중</div></div>
    <div class="sum-item"><div class="sum-num green" id="s-served">0</div><div class="sum-lbl">서빙 완료</div></div>
    <div class="sum-item"><div class="sum-num red" id="s-occ">0</div><div class="sum-lbl">이용 중 테이블</div></div>
    <div class="sum-item"><div class="sum-num" id="s-wait">0</div><div class="sum-lbl">웨이팅</div></div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('kitchen')">🍳 요리 관리</button>
    <button class="tab-btn" onclick="switchTab('waiting')">🙋 웨이팅 관리</button>
  </div>

  <!-- 요리 관리 탭 -->
  <div class="tab-content active" id="tab-kitchen">
    <div class="kitchen-cols">
      <!-- 좌: 이체완료 주문 -->
      <div class="col">
        <div class="col-header">
          <div class="col-title">✅ 이체 완료 · 조리 중</div>
          <span class="badge badge-green" id="paid-badge">0건</span>
        </div>
        <div class="col-body" id="paid-orders"></div>
      </div>
      <!-- 우: 입금 대기 주문 -->
      <div class="col">
        <div class="col-header">
          <div class="col-title">💳 입금 대기 주문</div>
          <span class="badge badge-yellow" id="pending-badge">0건</span>
        </div>
        <div class="col-body" id="pending-orders"></div>
      </div>
    </div>
  </div>

  <!-- 웨이팅 관리 탭 -->
  <div class="tab-content" id="tab-waiting">
    <div class="waiting-cols">
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">🪑 테이블 관리</div>
          <span class="badge badge-gray" id="tbl-badge">-</span>
        </div>
        <div class="panel-body" id="table-list"></div>
      </div>
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">🙋 대기 목록</div>
          <span class="badge badge-yellow" id="wait-badge">0팀</span>
        </div>
        <div class="panel-body" id="waiting-list"></div>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="config.js"></script>
<script>
let paidOrders=[],pendingOrders=[],tables=[],waitings=[],timerInterval=null

function switchTab(name){
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',['kitchen','waiting'][i]===name))
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'))
  document.getElementById('tab-'+name).classList.add('active')
}

async function loadAll(){ await Promise.all([loadOrders(),loadTables(),loadWaitings()]); startTimers() }

async function loadOrders(){
  // 이체완료 (좌측): payment_status='paid', status != 'served'
  const {data:paid}=await db.from('orders').select('*')
    .eq('payment_status','paid').neq('status','served')
    .order('payment_confirmed_at')
  paidOrders=paid||[]

  // 입금대기 (우측): payment_status='pending'
  const {data:pend}=await db.from('orders').select('*')
    .eq('payment_status','pending').order('created_at')
  pendingOrders=pend||[]

  renderPaidOrders(); renderPendingOrders(); updateSummary()
}

async function loadTables(){
  const {data}=await db.from('tables').select('*').order('id')
  tables=data||[]; renderTableList(); updateSummary()
}

async function loadWaitings(){
  const {data}=await db.from('waitings').select('*').eq('status','waiting').order('created_at')
  waitings=data||[]; renderWaitingList(); updateSummary()
}

function updateSummary(){
  const occ=tables.filter(t=>t.status==='occupied').length
  document.getElementById('s-pending').textContent=pendingOrders.length
  document.getElementById('s-cooking').textContent=paidOrders.filter(o=>o.status==='cooking').length
  document.getElementById('s-served').textContent=paidOrders.filter(o=>o.status==='partial').length
  document.getElementById('s-occ').textContent=occ
  document.getElementById('s-wait').textContent=waitings.length
  document.getElementById('paid-badge').textContent=paidOrders.length+'건'
  document.getElementById('pending-badge').textContent=pendingOrders.length+'건'
  document.getElementById('tbl-badge').textContent=`${occ}/${tables.length}석 이용중`
  document.getElementById('wait-badge').textContent=waitings.length+'팀'
  document.getElementById('hdr-stats').textContent=`조리 ${paidOrders.length} · 대기 ${waitings.length}팀`
}

// ── 좌측: 이체완료 주문 렌더링 ──
function renderPaidOrders(){
  const c=document.getElementById('paid-orders')
  if(!paidOrders.length){c.innerHTML='<div class="empty-state">이체 완료된 주문이 없습니다.</div>';return}
  c.innerHTML=paidOrders.map(o=>{
    const items=o.items||[], served=o.served_items||{}
    const sc=items.filter(i=>served[i.name]).length, tot=items.length
    const allDone=sc===tot, pct=tot>0?Math.round(sc/tot*100):0
    const elapsed=Math.floor((new Date()-new Date(o.payment_confirmed_at||o.created_at))/60000)
    return `
    <div class="order-card ${allDone?'all-served':'cooking'}">
      <div class="oc-head">
        <div class="oc-title">🪑 ${o.table_number}번 테이블</div>
        <div class="oc-meta">
          <span class="badge ${allDone?'badge-green':'badge-yellow'}">${allDone?'완료':'조리중'}</span>
          <span class="oc-time">${elapsed}분 전</span>
        </div>
      </div>
      <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
      <div class="prog-txt">${sc}/${tot} 서빙 완료</div>
      <div class="menu-list">
        ${items.map(item=>`
          <div class="menu-item ${served[item.name]?'served':''}" onclick="toggleServed('${o.id}','${item.name}')">
            <div class="chk">${served[item.name]?'✓':''}</div>
            <div class="mn">${item.name}</div>
            <div class="mq">×${item.qty}</div>
          </div>
        `).join('')}
      </div>
      ${allDone?`<button class="btn btn-green complete-btn" onclick="completeOrder('${o.id}',${o.table_id})">✅ 다 나감 확인 → 타이머 시작</button>`:''}
    </div>`
  }).join('')
}

// ── 우측: 입금대기 주문 렌더링 ──
function renderPendingOrders(){
  const c=document.getElementById('pending-orders')
  if(!pendingOrders.length){c.innerHTML='<div class="empty-state">입금 대기 주문이 없습니다.</div>';return}
  c.innerHTML=pendingOrders.map(o=>{
    const items=o.items||[]
    const total=items.reduce((s,i)=>s+(i.price||0)*i.qty,0)
    const elapsed=Math.floor((new Date()-new Date(o.created_at))/60000)
    return `
    <div class="pending-card">
      <div class="pc-head">
        <div class="pc-title">🪑 ${o.table_number}번 테이블</div>
        <span class="pc-time">${elapsed}분 전</span>
      </div>
      <div class="pc-items">
        ${items.map(i=>`<div class="pc-item"><span>${i.name} ×${i.qty}</span><span>₩${((i.price||0)*i.qty).toLocaleString()}</span></div>`).join('')}
      </div>
      <div class="pc-total">합계 ₩${total.toLocaleString()}</div>
      <button class="paid-btn" onclick="confirmPayment('${o.id}')">💳 이체완료 확인</button>
    </div>`
  }).join('')
}

// 이체완료 확인 → 좌측으로 이동
async function confirmPayment(oid){
  const {error}=await db.from('orders').update({
    payment_status:'paid',
    status:'cooking',
    payment_confirmed_at:new Date().toISOString()
  }).eq('id',oid)
  if(error){showToast('오류: '+error.message);return}
  showToast('✅ 이체 완료 처리됨!'); await loadOrders()
}

// 메뉴 서빙 토글
async function toggleServed(oid,name){
  const o=paidOrders.find(x=>x.id===oid); if(!o) return
  const s={...(o.served_items||{})}; s[name]=!s[name]
  const allDone=(o.items||[]).every(i=>s[i.name])
  await db.from('orders').update({served_items:s,status:allDone?'partial':'cooking'}).eq('id',oid)
  await loadOrders()
}

// 다 나감 확인 → 타이머 시작
async function completeOrder(oid,tableId){
  const end=new Date(Date.now()+2*60*60*1000).toISOString()
  await Promise.all([
    db.from('orders').update({status:'served'}).eq('id',oid),
    db.from('tables').update({status:'occupied',timer_end_at:end}).eq('id',tableId)
  ])
  showToast('⏱️ 2시간 타이머 시작!'); await loadAll()
}

// 테이블 목록
function renderTableList(){
  const c=document.getElementById('table-list')
  c.innerHTML=tables.map(t=>{
    const occ=t.status==='occupied'
    const rem=t.timer_end_at?Math.max(0,Math.floor((new Date(t.timer_end_at)-new Date())/1000)):null
    return `
    <div class="tmgmt-card ${occ?'occupied':''}">
      <div class="tmgmt-num">${t.table_number}번</div>
      <div class="tmgmt-info">
        <span class="badge ${occ?'badge-red':'badge-green'}">${occ?'이용중':'비어있음'}</span>
        ${occ&&rem!==null?`<div class="tmgmt-timer" data-end="${t.timer_end_at}">${fmt(rem)}</div>`:''}
      </div>
      <div class="tmgmt-actions">
        ${occ?`<button class="btn btn-red" onclick="clearTable(${t.id})">퇴실</button>`
              :`<button class="btn btn-primary" onclick="seatTable(${t.id})">착석</button>`}
      </div>
    </div>`
  }).join('')
}

async function seatTable(id){await db.from('tables').update({status:'occupied',timer_end_at:null}).eq('id',id);await loadTables()}
async function clearTable(id){if(!confirm('퇴실 처리하시겠습니까?'))return;await db.from('tables').update({status:'empty',timer_end_at:null}).eq('id',id);await loadTables()}

// 웨이팅 목록
function renderWaitingList(){
  const c=document.getElementById('waiting-list')
  if(!waitings.length){c.innerHTML='<div class="empty-state">대기 중인 팀이 없습니다.</div>';return}
  c.innerHTML=waitings.map((w,i)=>`
    <div class="witem">
      <div class="wrank">${i+1}</div>
      <div class="winfo"><div class="wphone">${w.phone}</div><div class="wsub">${w.party_size||1}명 · ${timeAgo(w.created_at)} 신청</div></div>
      <div class="wactions">
        <button class="btn btn-primary" onclick="callWaiting('${w.id}')">호출</button>
        <button class="btn btn-outline" onclick="cancelWaiting('${w.id}')">취소</button>
      </div>
    </div>`).join('')
}

async function callWaiting(id){await db.from('waitings').update({status:'called'}).eq('id',id);showToast('📞 호출 처리됨');await loadWaitings()}
async function cancelWaiting(id){if(!confirm('취소하시겠습니까?'))return;await db.from('waitings').update({status:'cancelled'}).eq('id',id);await loadWaitings()}

// 타이머
function startTimers(){
  if(timerInterval)clearInterval(timerInterval)
  timerInterval=setInterval(()=>{
    document.querySelectorAll('[data-end]').forEach(el=>{
      const rem=Math.max(0,Math.floor((new Date(el.dataset.end)-new Date())/1000))
      el.textContent=fmt(rem)
      if(rem===0)el.style.color='var(--yellow)'
    })
  },1000)
}

function fmt(sec){
  if(sec<=0)return'00:00'
  const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60
  if(h>0)return`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
  return`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
}
function timeAgo(d){const m=Math.floor((new Date()-new Date(d))/60000);return m<1?'방금':`${m}분 전`}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}

// 실시간
db.channel('kds')
  .on('postgres_changes',{event:'*',schema:'public',table:'orders'},loadOrders)
  .on('postgres_changes',{event:'*',schema:'public',table:'tables'},loadTables)
  .on('postgres_changes',{event:'*',schema:'public',table:'waitings'},loadWaitings)
  .subscribe()

loadAll()
</script>
</body>
</html>
