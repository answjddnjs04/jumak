<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>테이블오더 - 고객 화면</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .page { padding: 24px; max-width: 900px; margin: 0 auto; }

    /* 대기 현황 배너 */
    .waiting-banner {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border: 1px solid #2a2a5a;
      border-radius: 14px;
      padding: 20px 24px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .waiting-banner .info { display: flex; gap: 32px; }
    .waiting-banner .stat { text-align: center; }
    .waiting-banner .stat .num {
      font-size: 32px;
      font-weight: 800;
      color: var(--primary);
    }
    .waiting-banner .stat .label {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* 테이블 그리드 */
    .section-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-size: 13px;
    }
    .table-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
      margin-bottom: 32px;
    }
    .table-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 20px 16px;
      text-align: center;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }
    .table-card.empty {
      border-color: var(--green);
      background: rgba(34,197,94,0.05);
    }
    .table-card.occupied {
      border-color: var(--red);
      background: rgba(239,68,68,0.05);
    }
    .table-card.warning {
      border-color: var(--yellow);
      background: rgba(234,179,8,0.07);
    }
    .table-card .table-num {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .table-card .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }
    .empty .status-dot { background: var(--green); }
    .occupied .status-dot { background: var(--red); }
    .warning .status-dot { background: var(--yellow); }
    .table-card .timer {
      font-size: 20px;
      font-weight: 700;
      margin-top: 8px;
      font-variant-numeric: tabular-nums;
    }
    .occupied .timer { color: var(--red); }
    .warning .timer { color: var(--yellow); }
    .table-card .status-text {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* 웨이팅 버튼 (고정) */
    .waiting-fab {
      position: fixed;
      bottom: 32px;
      right: 32px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 50px;
      padding: 18px 32px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(255,107,53,0.5);
      transition: all 0.2s;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .waiting-fab:hover { transform: translateY(-3px); box-shadow: 0 12px 40px rgba(255,107,53,0.6); }
    .waiting-fab .pulse {
      width: 10px; height: 10px;
      background: white;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.4); }
    }

    /* 웨이팅 모달 추가 스타일 */
    .wait-info-box {
      background: var(--surface2);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .wait-info-box .row {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .wait-info-box .row:last-child { margin-bottom: 0; }
    .wait-info-box .row span:last-child { font-weight: 700; color: var(--primary); }
    .notice {
      font-size: 12px;
      color: var(--text-muted);
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.2);
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 16px;
      line-height: 1.6;
    }

    /* 웨이팅 리스트 */
    .waiting-list { display: flex; flex-direction: column; gap: 10px; }
    .waiting-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .waiting-item .rank {
      font-size: 22px;
      font-weight: 800;
      color: var(--primary);
      width: 36px;
    }
    .waiting-item .phone { font-size: 15px; font-weight: 600; }
    .waiting-item .wait-time { font-size: 13px; color: var(--text-muted); }
  </style>
</head>
<body>

<div class="header">
  <h1>🍖 테이블오더</h1>
  <div class="nav-links">
    <a href="kitchen.html">🍳 주방관리</a>
  </div>
</div>

<div class="page">

  <!-- 대기 현황 배너 -->
  <div class="waiting-banner">
    <div class="info">
      <div class="stat">
        <div class="num" id="waiting-count">0</div>
        <div class="label">현재 대기팀</div>
      </div>
      <div class="stat">
        <div class="num" id="empty-count">0</div>
        <div class="label">빈 테이블</div>
      </div>
      <div class="stat">
        <div class="num" id="est-wait">-</div>
        <div class="label">예상 대기(분)</div>
      </div>
    </div>
    <button class="btn btn-outline" onclick="toggleWaitingList()">대기 목록 보기</button>
  </div>

  <!-- 대기 목록 (토글) -->
  <div id="waiting-list-section" style="display:none; margin-bottom:24px;">
    <div class="section-title">현재 대기 목록</div>
    <div class="waiting-list" id="waiting-list-container">
      <div style="color:var(--text-muted); font-size:14px; padding:16px;">대기 중인 팀이 없습니다.</div>
    </div>
  </div>

  <!-- 테이블 맵 -->
  <div class="section-title">테이블 현황</div>
  <div class="table-grid" id="table-grid">
    <!-- JS로 렌더링 -->
  </div>

</div>

<!-- 웨이팅 FAB 버튼 -->
<button class="waiting-fab" onclick="openWaitingModal()">
  <div class="pulse"></div>
  웨이팅하기
</button>

<!-- 웨이팅 신청 모달 -->
<div class="modal-overlay" id="waiting-modal">
  <div class="modal">
    <h2>🙋 웨이팅 신청</h2>
    <p>전화번호를 입력하시면 입장 전 카카오톡으로 안내드립니다.</p>
    <div class="wait-info-box">
      <div class="row"><span>현재 대기팀</span><span id="modal-waiting-count">0팀</span></div>
      <div class="row"><span>예상 대기시간</span><span id="modal-est-wait">약 -분</span></div>
    </div>
    <div class="notice">
      ⚠️ 호출 후 <strong>3분 내 미입장 시 자동 노쇼 취소</strong>됩니다.<br>
      입장 1시간 전 / 30분 전 / 10분 전 알림을 발송해드립니다.
    </div>
    <input type="tel" id="phone-input" placeholder="010-0000-0000" maxlength="13">
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeWaitingModal()">취소</button>
      <button class="btn btn-primary" onclick="submitWaiting()">신청하기</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="config.js"></script>
<script>
  let tables = []
  let waitings = []
  let timerInterval = null

  // 초기화
  async function init() {
    await loadTables()
    await loadWaitings()
    startTimers()
    subscribeRealtime()
  }

  // 테이블 로드
  async function loadTables() {
    const { data, error } = await db.from('tables').select('*').order('id')
    if (error) { console.error(error); return }
    tables = data || []
    renderTables()
    updateBanner()
  }

  // 웨이팅 로드
  async function loadWaitings() {
    const { data, error } = await db.from('waitings')
      .select('*')
      .eq('status', 'waiting')
      .order('created_at')
    if (error) { console.error(error); return }
    waitings = data || []
    renderWaitingList()
    updateBanner()
  }

  // 테이블 렌더링
  function renderTables() {
    const grid = document.getElementById('table-grid')
    grid.innerHTML = ''
    tables.forEach(t => {
      const card = document.createElement('div')
      let cls = 'table-card '
      let timerHtml = ''
      let statusText = '이용 가능'

      if (t.status === 'occupied' && t.timer_end_at) {
        const remaining = Math.floor((new Date(t.timer_end_at) - new Date()) / 1000)
        if (remaining <= 0) {
          cls += 'warning'
          timerHtml = `<div class="timer">시간 초과</div>`
          statusText = '시간 초과'
        } else if (remaining <= 1800) {
          cls += 'warning'
          timerHtml = `<div class="timer" data-end="${t.timer_end_at}">${formatTime(remaining)}</div>`
          statusText = '30분 이내'
        } else {
          cls += 'occupied'
          timerHtml = `<div class="timer" data-end="${t.timer_end_at}">${formatTime(remaining)}</div>`
          statusText = '이용 중'
        }
      } else if (t.status === 'occupied') {
        cls += 'occupied'
        timerHtml = `<div class="timer">-</div>`
        statusText = '이용 중'
      } else {
        cls += 'empty'
        timerHtml = `<div class="timer" style="color:var(--green); font-size:14px; margin-top:8px;">✓ 이용 가능</div>`
      }

      card.className = cls
      card.innerHTML = `
        <div class="table-num">${t.table_number}번</div>
        <span class="status-dot"></span><span style="font-size:13px; color:var(--text-muted)">${statusText}</span>
        ${timerHtml}
      `
      grid.appendChild(card)
    })
  }

  // 배너 업데이트
  function updateBanner() {
    const empty = tables.filter(t => t.status === 'empty').length
    document.getElementById('waiting-count').textContent = waitings.length
    document.getElementById('empty-count').textContent = empty
    const estWait = calcEstWait()
    document.getElementById('est-wait').textContent = estWait > 0 ? estWait : '-'
    document.getElementById('modal-waiting-count').textContent = waitings.length + '팀'
    document.getElementById('modal-est-wait').textContent = estWait > 0 ? `약 ${estWait}분` : '곧 입장 가능'
  }

  // 예상 대기 시간 계산
  function calcEstWait() {
    if (waitings.length === 0) return 0
    const now = new Date()
    const endTimes = tables
      .filter(t => t.status === 'occupied' && t.timer_end_at)
      .map(t => Math.max(0, Math.floor((new Date(t.timer_end_at) - now) / 60000)))
      .sort((a, b) => a - b)
    if (endTimes.length === 0) return 5
    const slot = Math.min(waitings.length, endTimes.length)
    return (endTimes[slot - 1] || endTimes[endTimes.length - 1]) + 5
  }

  // 타이머 렌더링
  function startTimers() {
    if (timerInterval) clearInterval(timerInterval)
    timerInterval = setInterval(() => {
      document.querySelectorAll('.timer[data-end]').forEach(el => {
        const remaining = Math.floor((new Date(el.dataset.end) - new Date()) / 1000)
        if (remaining <= 0) {
          el.textContent = '시간 초과'
          el.style.color = 'var(--yellow)'
        } else {
          el.textContent = formatTime(remaining)
        }
      })
      updateBanner()
    }, 1000)
  }

  function formatTime(sec) {
    if (sec <= 0) return '00:00'
    const h = Math.floor(sec / 3600)
    const m = Math.floor((sec % 3600) / 60)
    const s = sec % 60
    if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
  }

  // 실시간 구독
  function subscribeRealtime() {
    db.channel('table-changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'tables' }, loadTables)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'waitings' }, loadWaitings)
      .subscribe()
  }

  // 웨이팅 목록 렌더링
  function renderWaitingList() {
    const container = document.getElementById('waiting-list-container')
    if (waitings.length === 0) {
      container.innerHTML = '<div style="color:var(--text-muted); font-size:14px; padding:16px;">대기 중인 팀이 없습니다.</div>'
      return
    }
    container.innerHTML = waitings.map((w, i) => `
      <div class="waiting-item">
        <div class="rank">${i + 1}</div>
        <div>
          <div class="phone">${maskPhone(w.phone)}</div>
          <div class="wait-time">${timeAgo(w.created_at)} 신청</div>
        </div>
        <span class="badge badge-yellow">대기중</span>
      </div>
    `).join('')
  }

  function maskPhone(phone) {
    return phone.replace(/(\d{3})-?(\d{4})-?(\d{4})/, '$1-****-$3')
  }
  function timeAgo(dateStr) {
    const mins = Math.floor((new Date() - new Date(dateStr)) / 60000)
    if (mins < 1) return '방금'
    return `${mins}분 전`
  }

  // 모달
  function openWaitingModal() {
    updateBanner()
    document.getElementById('waiting-modal').classList.add('active')
    document.getElementById('phone-input').focus()
  }
  function closeWaitingModal() {
    document.getElementById('waiting-modal').classList.remove('active')
    document.getElementById('phone-input').value = ''
  }
  function toggleWaitingList() {
    const el = document.getElementById('waiting-list-section')
    el.style.display = el.style.display === 'none' ? 'block' : 'none'
  }

  // 전화번호 자동 하이픈
  document.getElementById('phone-input').addEventListener('input', function(e) {
    let v = e.target.value.replace(/\D/g, '')
    if (v.length >= 8) v = v.replace(/^(\d{3})(\d{4})(\d{0,4})/, '$1-$2-$3')
    else if (v.length >= 4) v = v.replace(/^(\d{3})(\d{0,4})/, '$1-$2')
    e.target.value = v
  })

  // 웨이팅 신청
  async function submitWaiting() {
    const phone = document.getElementById('phone-input').value.replace(/-/g, '')
    if (phone.length < 10) { showToast('올바른 전화번호를 입력해주세요.'); return }

    const { error } = await db.from('waitings').insert({
      phone: document.getElementById('phone-input').value,
      status: 'waiting'
    })
    if (error) { showToast('신청 중 오류가 발생했습니다.'); console.error(error); return }
    closeWaitingModal()
    showToast('✅ 웨이팅 신청이 완료되었습니다!')
    await loadWaitings()
  }

  function showToast(msg) {
    const t = document.getElementById('toast')
    t.textContent = msg
    t.classList.add('show')
    setTimeout(() => t.classList.remove('show'), 3000)
  }

  init()
</script>
</body>
</html>
