<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>路寶官 - 웨이팅</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    html,body { overflow:hidden; }
    .app { display:flex; flex-direction:column; height:100vh; width:100vw; overflow:hidden; }
    .header { flex-shrink:0; background:var(--surface); border-bottom:1px solid var(--border); padding:0 28px; height:58px; display:flex; align-items:center; justify-content:space-between; }
    .header-logo { font-size:20px; font-weight:800; display:flex; align-items:center; gap:10px; }
    .header-logo .kr { color:var(--primary); font-size:16px; }
    .main-area { flex:1; background:linear-gradient(135deg,#141420,#1c1c30); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; }
    .waiting-label { font-size:20px; font-weight:700; color:#FF6B35; letter-spacing:.08em; }
    .waiting-number { font-size:140px; font-weight:900; color:#ffffff; line-height:1; }
    .waiting-unit { font-size:20px; color:#aaa; margin-top:4px; }
    /* FAB */
    .fab { position:fixed; bottom:40px; left:50%; transform:translateX(-50%); background:var(--primary); color:white; border:none; border-radius:50px; padding:16px 40px; font-size:17px; font-weight:800; cursor:pointer; box-shadow:0 6px 28px rgba(255,107,53,.45); transition:all .2s; z-index:50; display:flex; align-items:center; gap:10px; white-space:nowrap; }
    .fab:hover { box-shadow:0 10px 36px rgba(255,107,53,.55); }
    .pulse { width:9px;height:9px;background:white;border-radius:50%;animation:pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.5)} }
    /* modal */
    .info-box { background:var(--surface2); border-radius:10px; padding:14px 16px; margin-bottom:14px; }
    .info-row { display:flex; justify-content:space-between; font-size:13px; margin-bottom:7px; }
    .info-row:last-child { margin-bottom:0; }
    .info-row span:last-child { font-weight:700; color:var(--primary); }
    .notice { font-size:12px; color:var(--text-muted); background:rgba(239,68,68,.07); border:1px solid rgba(239,68,68,.18); border-radius:8px; padding:10px 13px; margin-bottom:14px; line-height:1.7; }
    .party-row { display:flex; align-items:center; gap:16px; margin-bottom:14px; }
    .party-label { font-size:13px; font-weight:700; color:var(--text-muted); margin-bottom:10px; }
    .party-btn { width:40px; height:40px; border-radius:50%; border:1.5px solid var(--border); background:var(--surface2); color:var(--text); font-size:22px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .15s; }
    .party-btn.plus { background:var(--primary); color:white; border-color:var(--primary); }
    .party-num { font-size:26px; font-weight:800; min-width:32px; text-align:center; }
    .party-unit { font-size:14px; color:var(--text-muted); }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-logo">路寶官 <span class="kr">로봇관</span></div>
    <div style="font-size:12px;color:var(--text-muted)">고객 화면</div>
  </div>
  <div class="main-area">
    <div class="waiting-label">현재 대기팀</div>
    <div class="waiting-number" id="waiting-count">0</div>
    <div class="waiting-unit">팀</div>
    <div style="font-size:13px;color:#666;margin-top:24px;text-align:center;line-height:1.8;">아래 버튼을 누르면<br>실시간 대기 현황이 최신화됩니다.</div>
    <button onclick="loadWaitings()" style="margin-top:12px;background:var(--surface);border:1.5px solid var(--border);color:var(--text);border-radius:14px;padding:14px 36px;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:10px;transition:all .2s;" onmouseover="this.style.borderColor='#FF6B35';this.style.color='#FF6B35'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--text)'">🔄 새로고침</button>
  </div>
</div>

<button class="fab" onclick="openModal()"><div class="pulse"></div>웨이팅하기</button>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2>🙋 웨이팅 신청</h2>
    <div class="sub">전화번호를 입력하시면 전화 연락으로 안내드립니다.</div>
    <div class="info-box">
      <div class="info-row"><span>현재 대기팀</span><span id="m-waiting">0팀</span></div>
    </div>
    <div class="notice">⚠️ 전화 연락 후 <strong>5분 내 미응답 시 자동 노쇼 취소</strong>됩니다.<br>입장 가능 시간에 맞춰 연락을 드리겠습니다.</div>
    <input type="tel" id="phone" placeholder="010-0000-0000" maxlength="13">
    <div class="party-label">인원수</div>
    <div class="party-row">
      <button class="party-btn" onclick="changeParty(-1)">−</button>
      <div class="party-num" id="party-num">1</div>
      <button class="party-btn plus" onclick="changeParty(1)">+</button>
      <span class="party-unit">명</span>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">취소</button>
      <button class="btn btn-primary" onclick="submitWaiting()">신청하기</button>
    </div>
  </div>
</div>
<div id="toast"></div>
<script src="config.js"></script>
<script>
let waitings=[], partySize=1

async function init(){
  await loadWaitings()
  db.channel('idx')
    .on('postgres_changes',{event:'*',schema:'public',table:'waitings'},loadWaitings)
    .subscribe()
  // 5초마다 강제 갱신
  setInterval(loadWaitings, 5000)
}

async function loadWaitings(){
  const {data}=await db.from('waitings').select('*').eq('status','waiting').order('created_at')
  waitings=data||[]
  document.getElementById('waiting-count').textContent=waitings.length
  document.getElementById('m-waiting').textContent=waitings.length+'팀'
}

function changeParty(d){
  partySize=Math.max(1,Math.min(20,partySize+d))
  document.getElementById('party-num').textContent=partySize
}

function openModal(){
  document.getElementById('m-waiting').textContent=waitings.length+'팀'
  document.getElementById('modal').classList.add('active')
  document.getElementById('phone').focus()
}
function closeModal(){
  document.getElementById('modal').classList.remove('active')
  document.getElementById('phone').value=''
  partySize=1
  document.getElementById('party-num').textContent=1
}

document.getElementById('phone').addEventListener('input',function(e){
  let v=e.target.value.replace(/\D/g,'')
  if(v.length>=8) v=v.replace(/^(\d{3})(\d{4})(\d{0,4})/,'$1-$2-$3')
  else if(v.length>=4) v=v.replace(/^(\d{3})(\d{0,4})/,'$1-$2')
  e.target.value=v
})

async function submitWaiting(){
  const phone=document.getElementById('phone').value
  if(phone.replace(/-/g,'').length<10){showToast('올바른 전화번호를 입력해주세요.');return}
  const {error}=await db.from('waitings').insert({phone,party_size:partySize,status:'waiting'})
  if(error){showToast('오류: '+error.message);return}
  closeModal()
  showToast('✅ 웨이팅 신청이 완료되었습니다!')
  await loadWaitings()
}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}
init()
</script>
</body>
</html>
